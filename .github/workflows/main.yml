name: Build Ironclad OS Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kiosk-launcher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signed with the committed kiosk-release.jks (see keystore.properties) so
      # CI-built APKs install over the version the website offers.
      - name: Build signed Release APK
        run: gradle assembleRelease

      # Fails if the APK that was just built still carries an older versionName /
      # versionCode than app/build.gradle.kts declares.
      - name: Verify built APK matches the declared version
        working-directory: ${{ github.workspace }}
        run: node scripts/apk-meta.mjs --check --apk android-kiosk-launcher/app/build/outputs/apk/release/app-release.apk

      # Fails if public/downloads/IroncladOS.apk or src/generated/apkMeta.ts (the
      # version and size shown on the site) disagree with each other.
      - name: Verify the download page matches the published APK
        working-directory: ${{ github.workspace }}
        run: node scripts/apk-meta.mjs --check

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ironclad OS-release-apk
          path: android-kiosk-launcher/app/build/outputs/apk/release/app-release.apk
