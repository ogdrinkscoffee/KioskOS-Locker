name: Build Ironclad OS Android APK

on:
  push:
    branches: [ main ]
    # The publish step commits the built APK, its metadata and the update feed.
    # Ignoring those paths stops that commit from starting another build: a signed
    # APK is never byte-identical (signing timestamps), so without this the checksum
    # would change every run and the workflow would loop forever.
    paths-ignore:
      - 'public/downloads/IroncladOS.apk'
      - 'public/downloads/latest.json'
      - 'src/generated/apkMeta.ts'
  workflow_dispatch:

# Required for the publish step to push the new APK back to main.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kiosk-launcher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Tells the admin straight away if the token cannot publish, instead of failing
      # after a nine-minute build. A warning, not an error: the build and its artifact
      # are still useful, and the download page can be refreshed by a manual publish.
      - name: Check the token can publish
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git push --dry-run origin HEAD:main >/dev/null 2>&1; then
            echo "Token can push to main."
          else
            echo "::warning::The workflow token cannot push to main, so the published APK" \
              "will not be committed. Set Settings → Actions → General → Workflow" \
              "permissions to 'Read and write permissions' to enable automatic publishing."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signed with the committed kiosk-release.jks (see keystore.properties) so
      # CI-built APKs install over the version the website offers.
      - name: Build signed Release APK
        run: gradle assembleRelease

      # Fails if the APK that was just built still carries an older versionName /
      # versionCode than app/build.gradle.kts declares.
      - name: Verify built APK matches the declared version
        working-directory: ${{ github.workspace }}
        run: node scripts/apk-meta.mjs --check --apk android-kiosk-launcher/app/build/outputs/apk/release/app-release.apk

      # Copies the built APK over the published download and regenerates both the
      # version metadata and public/downloads/latest.json (the in-app update feed).
      - name: Publish the built APK and update feed
        working-directory: ${{ github.workspace }}
        run: |
          cp android-kiosk-launcher/app/build/outputs/apk/release/app-release.apk public/downloads/IroncladOS.apk
          node scripts/apk-meta.mjs

      # Fails if public/downloads/IroncladOS.apk, src/generated/apkMeta.ts and
      # latest.json disagree with each other after publishing.
      - name: Verify the download page matches the published APK
        working-directory: ${{ github.workspace }}
        run: node scripts/apk-meta.mjs --check

      # Uploaded before the publish commit so a token/permission problem can never cost
      # you the built APK: the artifact is always retrievable from the run summary.
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Ironclad OS-release-apk
          path: android-kiosk-launcher/app/build/outputs/apk/release/app-release.apk

      # Commits the freshly published APK so the deployed site and the in-app feed
      # both point at this build. Skipped for forks and pull requests.
      #
      # continue-on-error: the download page is the only thing affected if this fails,
      # and a red build would hide the successful APK build above it.
      - name: Commit the published APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/IroncladOS.apk public/downloads/latest.json src/generated/apkMeta.ts
          if git diff --staged --quiet; then
            echo "Published APK already current."
            exit 0
          fi
          # [skip ci] is belt-and-braces next to paths-ignore, so neither the actor
          # nor a future workflow edit can turn this into a build loop.
          git commit -m "Publish Ironclad OS APK $(node -p "require('./public/downloads/latest.json').version") [skip ci]"
          if git push origin HEAD:main; then
            echo "Published APK committed."
          else
            echo "::warning::Could not push the published APK. The build and its artifact" \
              "succeeded, but public/downloads was not updated. Fix by setting" \
              "Settings → Actions → General → Workflow permissions to" \
              "'Read and write permissions'."
          fi

