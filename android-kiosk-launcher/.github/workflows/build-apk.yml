name: Build KioskOS Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Build Release APK (Unsigned)
        run: gradle assembleRelease

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: KioskOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload app-release-unsigned.apk
        uses: actions/upload-artifact@v4
        with:
          name: KioskOS-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          generate_release_notes: true
