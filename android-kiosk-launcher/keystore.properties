# Release signing for the Ironclad OS APK that the website offers for download.
#
# This file and kiosk-release.jks are committed on purpose: the APK is
# sideloaded, never published to a store, so the app identity has to survive
# across machines, CI runs and rebuilds. Keeping the same key means a new
# IroncladOS.apk installs over an older one instead of forcing an uninstall.
# The password protects nothing beyond that identity, so it is public here.
#
# storeFile is resolved relative to android-kiosk-launcher/.
storeFile=kiosk-release.jks
storePassword=kioskos-release
keyAlias=kiosk
keyPassword=kioskos-release
